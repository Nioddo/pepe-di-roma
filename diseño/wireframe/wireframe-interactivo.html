  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

swap;\n  src: url(\"0e9f4a11-8e7f-480d-836d-608a69bb4f88\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Patrick Hand';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"dcc12d4a-f45d-4248-9277-a45b1a67d46e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>body{margin:0;background:#f0eee9;font-family:'Patrick Hand',system-ui,sans-serif;color:#333}html{scroll-behavior:smooth}a{color:#CE1320}a:hover{color:#a80e18}input,select{font-family:'Patrick Hand',system-ui,sans-serif}<\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- NAVBAR -->\n<header style=\"display:flex;align-items:center;gap:24px;padding:12px 32px;background:#fff;border-bottom:2px solid #555;position:sticky;top:0;z-index:50;flex-wrap:wrap\">\n  <a onclick=\"{{ goInicio }}\" style=\"border:2px solid #555;padding:6px 12px;font-family:'Anton',sans-serif;font-size:15px;letter-spacing:1px;color:#333;cursor:pointer;text-decoration:none\">PEPE DI ROMA<\u002Fa>\n  <nav style=\"display:flex;gap:18px;font-size:16px;flex-wrap:wrap\">\n    <sc-for list=\"{{ navItems }}\" as=\"n\" hint-placeholder-count=\"4\">\n      <a onclick=\"{{ n.go }}\" style=\"color:{{ n.color }};cursor:pointer;text-decoration:none\" style-hover=\"color:#CE1320\">{{ n.label }}<\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fnav>\n  <div style=\"display:flex;gap:10px;margin-left:auto;align-items:center\">\n    <sc-if value=\"{{ isVisitante }}\" hint-placeholder-val=\"{{ true }}\">\n      <a onclick=\"{{ goIngresar }}\" style=\"border:2px solid #CE1320;color:#CE1320;background:#fff;font-size:14px;padding:7px 14px;border-radius:3px;cursor:pointer;text-decoration:none\">INGRESAR<\u002Fa>\n      <a onclick=\"{{ goRegistrarse }}\" style=\"border:2px solid #CE1320;background:#CE1320;color:#fff;font-size:14px;padding:7px 14px;border-radius:3px;cursor:pointer;text-decoration:none\">REGISTRARSE<\u002Fa>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isAuthed }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <span style=\"font-size:14px;color:#777\">{{ userBadge }}<\u002Fspan>\n        <a onclick=\"{{ goSalir }}\" style=\"border:2px solid #CE1320;color:#CE1320;background:#fff;font-size:14px;padding:7px 14px;border-radius:3px;cursor:pointer;text-decoration:none\">SALIR<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ INICIO ============ -->\n<sc-if value=\"{{ isInicio }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-screen-label=\"Inicio\" style=\"padding:28px 32px;display:flex;flex-direction:column;gap:26px;max-width:1180px;margin:0 auto\">\n  <!-- HERO -->\n  <div style=\"position:relative;border:2px solid #999;border-radius:6px;min-height:280px;background:repeating-linear-gradient(45deg,#f4f2ee,#f4f2ee 9px,#e9e6e0 9px,#e9e6e0 18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px 20px\">\n    <div style=\"position:absolute;top:10px;left:12px;background:#1a1a1a;color:#fff;font-size:12px;padding:2px 8px;border-radius:3px\">HERO — foto de fondo<\u002Fdiv>\n    <div style=\"font-size:14px;letter-spacing:3px;color:#777\">FÁBRICA DE PASTAS ARTESANALES · VILLA DEVOTO<\u002Fdiv>\n    <div style=\"font-family:'Anton',sans-serif;font-size:44px;color:#444;line-height:1.05;max-width:640px\">PASTAS HECHAS A LA VISTA, TODOS LOS DÍAS<\u002Fdiv>\n    <div style=\"font-size:16px;color:#888;max-width:460px\">Subtítulo de bienvenida del restaurante.<\u002Fdiv>\n    <div style=\"display:flex;gap:12px;margin-top:6px\">\n      <a onclick= px\"><\u002Fdiv>\n            <div style=\"height:7px;width:60%;background:#ddd;border-radius:4px\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <a onclick=\"{{ goMenu }}\" style=\"background:#CE1320;color:#fff;border:2px solid #CE1320;border-radius:3px;padding:11px 30px;font-size:15px;cursor:pointer;text-decoration:none\">VER MENÚ<\u002Fa>\n  <\u002Fdiv>\n\n  <!-- SOBRE NOSOTROS -->\n  <div style=\"position:relative;border:2px solid #555;border-radius:6px;background:#faf7f2;padding:26px 22px;display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:center\">\n    <div style=\"position:absolute;top:-11px;left:14px;background:#1a1a1a;color:#fff;font-size:12px;padding:2px 8px;border-radius:3px\">SOBRE NOSOTROS<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:9px\">\n      <div style=\"font-family:'Anton',sans-serif;font-size:26px;color:#444\">SOBRE NOSOTROS<\u002Fdiv>\n      <div style=\"height:8px;width:100%;background:#ddd;border-radius:4px\"><\u002Fdiv>\n      <div style=\"height:8px;width:95%;background:#ddd;border-radius:4px\"><\u002Fdiv>\n      <div style=\"height:8px;width:88%;background:#ddd;border-radius:4px\"><\u002Fdiv>\n      <div style=\"height:8px;width:70%;background:#ddd;border-radius:4px\"><\u002Fdiv>\n      <a onclick=\"{{ goReservar }}\" style=\"align-self:flex-start;margin-top:8px;background:#fff;color:#CE1320;border:2px solid #CE1320;border-radius:3px;padding:9px 20px;font-size:14px;cursor:pointer;text-decoration:none\">CONOCÉ EL LOCAL<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"position:relative;height:220px;border:2px solid #999;border-radius:5px;background:repeating-linear-gradient(45deg,#f4f2ee,#f4f2ee 9px,#e9e6e0 9px,#e9e6e0 18px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;color:#8a857c;font-size:13px\">\n        <span style=\"background:rgba(255,255,255,.85);padding:3px 10px;border-radius:3px\">CARRUSEL · {{ carouselCaption }}<\u002Fspan>\n        <button onclick=\"{{ prevSlide }}\" style=\"position:absolute;left:10px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:2px solid #999;background:#fff;color:#CE1320;font-size:18px;cursor:pointer\">‹<\u002Fbutton>\n        <button onclick=\"{{ nextSlide }}\" style=\"position:absolute;right:10px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:2px solid #999;background:#fff;color:#CE1320;font-size:18px;cursor:pointer\">›<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;justify-content:center\">\n        <sc-for list=\"{{ dots }}\" as=\"dot\" hint-placeholder-count=\"4\">\n          <button onclick=\"{{ dot.go }}\" style=\"width:11px;height:11px;border-radius:50%;border:2px solid #CE1320;background:{{ dot.bg }};cursor:pointer;padding:0\"><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ MENÚ ============ -->\n<sc-if value=\"{{ isMenu }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Menú\" style=\"padding:28px 32px;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:26px\">\n  <div style=\"text-align:center;display:flex;flex-direction:column;gap:6px\">\n    <div style=\"font-family:'Anton',sans-serif;font-size:36px;color:#444\">NUESTRO MENÚ<\u002Fdiv>\n    <div style=\"font-size:14px;color:#888\">Etiquetas: apto vegano · apto sin TACC<\u002Fdiv>\n  <\u002Fdiv>\n  <sc-for list=\"{{ menuView }}\" as=\"cat\" hint-placeholder-count=\"4\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"font-family:'Anton',sans-serif;font-size:22px;color:#CE1320;white-space:nowrap\">{{ cat.title }}<\u002Fdiv>\n        <div style=\"flex:1;height:2px;background:#ccc\"><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ cat.hasItems }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px 32px\">\n          <sc-for list=\"{{ cat.dishes }}\" as=\"it\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:12px;align-items:center;border-bottom:1px dashed #ccc;padding-bottom:12px\">\n              <div style=\"width:64px;height:64px;border:2px solid #999;border-radius:5px;background:repeating-linear-gradient(45deg,#f4f2ee,#f4f2ee 7px,#e9e6e0 7px,#e9e6e0 14px);flex:none;display:flex;align-items:center;justify-content:center;color:#8a857c;font-size:10px\">FOTO<\u002Fdiv>\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:5px\">\n                <div style=\"display:flex;justify-content:space-between;gap:10px\">\n                  <span style=\"font-size:16px;color:#444;font-weight:600\">{{ it.name }}<\u002Fspan>\n                  <span style=\"font-size:15px;color:#CE1320;font-weight:600;white-space:nowrap\">{{ it.priceLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:6px\">\n                  <sc-for list=\"{{ it.tags }}\" as=\"tg\" hint-placeholder-count=\"2\">\n                    <span style=\"font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;background:{{ tg.bg }};color:{{ tg.color }}\">{{ tg.label }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ cat.empty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:22px;text-align:center;background:#faf7f2;border:1px dashed #bbb;border-radius:6px;color:#999;font-size:15px\">Todavía no hay platos en esta sección.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <div style=\"display:flex;gap:12px;justify-content:center\">\n    <a onclick=\"{{ goPedido }}\" style=\"background:#CE1320;color:#fff;border:2px solid #CE1320;border-radius:3px;padding:11px 28px;font-size:15px;cursor:pointer;text-decoration:none\">HACER PEDIDO<\u002Fa>\n    <a onclick=\"{{ goReservar }}\" style=\"background:#fff;color:#CE1320;border:2px solid #CE1320;border-radius:3px;padding:11px 28px;font-size:15px;cursor:pointer;text-decoration:none\">RESERVAR MESA<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ INGRESAR ============ -->\n<sc-if value=\"{{ isIngresar }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Ingresar\" style=\"display:flex;justify-content:center;padding:44px 24px\">\n  <div style=\"width:100%;max-width:400px;border:2px solid #555;border-radius:6px;background:#fff;padding:30px;display:flex;flex-direction:column;gap:16px\">\n    <div style=\"font-family:'Anton',sans-serif;font-size:26px;color:#444;text-align:center\">INGRESAR<\u002Fdiv>\n    <sc-if value=\"{{ authNote }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#fff6da;border:1px solid #e6cf8a;color:#8a6d00;font-size:13px;padding:9px 11px;border-radius:5px\">{{ authNote }}<\u002Fdiv><\u002Fsc-if>\n    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:13px;color:#777\">EMAIL\n      <input type=\"email\" value=\"{{ login.email }}\" oninput=\"{{ setLoginEmail }}\" placeholder=\"tu@email.com\" style=\"border:2px solid #999;border-radius:3px;padding:10px;font-size:15px\"><\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:13px;color:#777\">CONTRASEÑA\n      <input type=\"password\" value=\"{{ login.pass }}\" oninput=\"{{ setLoginPass }}\" placeholder=\"••••••\" style=\"border:2px solid #999;border-radius:3px;padding:10px;font-size:15px\"><\u002Flabel>\n    <a onclick=\"{{ doLogin }}\" style=\"background:#CE1320;color:#fff;border:2px solid #CE1320;border-radius:3px;padding:12px;font-size:15px;cursor:pointer;text-align:center;text-decoration:none\">INGRESAR<\u002Fa>\n    <div style=\"text-align:center;font-size:14px;color:#777\">¿No tenés cuenta? <a onclick=\"{{ goRegistrarse }}\" style=\"color:#CE1320;cursor:pointer\">Registrate<\u002Fa><\u002Fdiv>\n    <div style=\"background:#faf7f2;border:1px dashed #bbb;border-radius:5px;padding:10px;font-size:12px;color:#888;line-height:1.6\">Prueba: <b>cliente@pepediroma.com.ar<\u002Fb> → cliente · <b>admin@pepediroma.com.ar<\u002Fb> → admin<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ REGISTRARSE ============ -->\n<sc-if value=\"{{ isRegistrarse }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Registrarse\" style=\"display:flex;justify-content:center;padding:44px 24px\">\n  <div style=\"width:100%;max-width:420px;border:2px solid #555;border-radius:6px;background:#fff;padding:30px;display:flex;flex-direction:column;gap:16px\">\n    <div style=\"font-family:'Anton',sans-serif;font-size:26px;color:#444;text-align:center\">REGISTRARSE<\u002Fdiv>\n    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:13px;color:#777\">EMAIL\n      <input type=\"email\" value=\"{{ reg.email }}\" oninput=\"{{ setRegEmail }}\" placeholder=\"tu@email.com\" style=\"border:2px solid #999;border-radius:3px;padding:10px;font-size:15px\"><\u002Flabel>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n      <label style=\"display:flex;flex-direction:column;gap:5px;font-size:13px;color:#777\">CONTRASEÑA\n        <input type=\"password\" value=\"{{ reg.pass }}\" oninput=\"{{ setRegPass }}\" placeholder=\"••••••\" style=\"border:2px solid #999;border-radius:3px;padding:10px;font-size:15px\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:5px;font-size:13px;color:#777\">DNI\n        <input type=\"text\" value=\"{{ reg.dni }}\" oninput=\"{{ setRegDni }}\" placeholder=\"30.123.456\" style=\"border:2px solid #999;border-radius:3px;padding:10px;font-size:15px\"><\u002Flabel>\n    <\u002Fdiv>\n    <sc-if value=\"{{ regError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#fbe4e4;border:1px solid #eab3b3;color:#b02020;font-size:13px;padding:9px 11px;border-radius:5px\">{{ regError }}<\u002Fdiv><\u002Fsc-if>\n    <a onclick=\"{{ doRegister }}\" style=\"background:#CE1320;color:#fff;border:2px solid #CE1320;border-radius:3px;padding:12px;font-size:15px;cursor:pointer;text-align:center;text-decoration:none\">CREAR CUENTA<\u002Fa>\n    <div style=\"text-align:center;font-size:14px;color:#777\">¿Ya tenés cuenta? <a onclick=\"{{ goIngresar }}\" style=\"color:#CE1320;cursor:pointer\">Ingresá<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ RESERVAR ============ -->\n<sc-if value=\"{{ isReservar }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Reservar\" style=\"padding:28px 32px;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;flex-direction:column;gap:4px\">\n    <div style=\"font-family:'Anton',sans-serif;font-size:32px;color:#444\">{{ reservarTitle }}<\u002Fdiv>\n    <div style=\"font-size:14px;color:#888\">Toda reserva dura 2 horas · Mar–Dom 12–15 h y 20–24 h.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:13px;color:#777\">FECHA\n      <input type=\"date\" value=\"{{ res.date }}\" oninput=\"{{ setResDate }}\" style=\"border:2px solid #999;border-radius:3px;padding:10px;font-size:15px\"><\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:13px;color:#777\">HORARIO\n      <select value=\"{{ res.time }}\" onchange=\"{{ setResTime }}\" style=\"border:2px solid #999;border-radius:3px;padding:10px;font-size:15px;background:#fff\"><sc-for list=\"{{ slots }}\" as=\"sl\" hint-placeholder-count=\"6\"><option value=\"{{ sl }}\">{{ sl }}<\u002Foption><\u002Fsc-for><\u002Fselect><\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:13px;color:#777\">INTEGRANTES\n      <select value=\"{{ res.people }}\" onchange=\"{{ setResPeople }}\" style=\"border:2px solid #999;border-radius:3px;padding:10px;font-size:15px;background:#fff\"><sc-for list=\"{{ peopleOptions }}\" as=\"p\" hint-placeholder-count=\"8\"><option value=\"{{ p }}\">{{ p }}<\u002Foption><\u002Fsc-for><\u002Fselect><\u002Flabel>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showMap }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"border:2px solid #555;border-radius:6px;padding:20px;background:#faf7f2\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px\">\n        <div style=\"font-family:'Anton',sans-serif;font-size:18px;color:#444\">MAPA DEL SALÓN — ELEGÍ TU MESA<\u002Fdiv>\n        <div style=\"display:flex;gap:14px;font-size:12px;color:#777\">\n          <span style=\"display:flex;align-items:center;gap:5px\"><span style=\"width:13px;height:13px;border-radius:3px;background:#e4f4e8;border:2px solid #1f8a4d\"><\u002Fspan>Libre<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:5px\"><span style=\"width:13px;height:13px;border-radius:3px;background:#f2dede;border:2px solid #c99\"><\u002Fspan>Ocupada<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:5px\"><span style=\"width:13px;height:13px;border-radius:3px;background:#CE1320\"><\u002Fspan>Elegida<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n        <sc-for list=\"{{ mapTables }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <div onclick=\"{{ t.select }}\" style=\"border-radius:6px;padding:18px 12px;text-align:center;cursor:{{ t.cursor }};background:{{ t.bg }};border:2px solid {{ t.border }};color:{{ t.textColor }};opacity:{{ t.opacity }}\">\n            <div style=\"font-family:'Anton',sans-serif;font-size:22px\">{{ t.label }}<\u002Fdiv>\n            <div style=\"font-size:12px;margin-top:5px\">Cap. {{ t.cap }} · {{ t.stateLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ noTable }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#fff6da;border:1px solid #e6cf8a;border-radius:6px;padding:16px;color:#8a6d00;font-size:14px;line-height:1.5\">Para <b>5 o 6 personas<\u002Fb> no se elige mesa: queda <b>sin mesa asignada<\u002Fb> y el local te la asigna.<\u002Fdiv><\u002Fsc-if>\n  <sc-if value=\"{{ tooMany }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#fbe4e4;border:1px solid #eab3b3;border-radius:6px;padding:16px;color:#b02020;font-size:14px;line-height:1.5\">Para <b>más de 6 personas<\u002Fb> no se puede reservar online. Escribinos o llamanos.<\u002Fdiv><\u002Fsc-if>\n  <sc-if value=\"{{ resError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#fbe4e4;border:1px solid #eab3b3;color:#b02020;font-size:13px;padding:9px 11px;border-radius:5px\">{{ resError }}<\u002Fdiv><\u002Fsc-if>\n  <div><a onclick=\"{{ confirmReserva }}\" style=\"display:inline-block;background:{{ confirmBg }};color:#fff;border:2px solid {{ confirmBg }};border-radius:3px;padding:12px 34px;font-size:15px;cursor:{{ confirmCursor }};text-decoration:none\">CONFIRMAR RESERVA<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ MIS RESERVAS ============ -->\n<sc-if value=\"{{ isMisReservas }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Mis reservas\" style=\"padding:28px 32px;max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:18px\">\n  <div style=\"font-family:'Anton',sans-serif;font-size:32px;color:#444\">MIS RESERVAS<\u002Fdiv>\n  <sc-if value=\"{{ myReservationsEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:32px;text-align:center;background:#faf7f2;border:1px dashed #bbb;border-radius:6px;color:#999;font-size:15px\">Todavía no tenés reservas. <a onclick=\"{{ goReservar }}\" style=\"color:#CE1320;cursor:pointer\">Reservá una mesa<\u002Fa>.<\u002Fdiv><\u002Fsc-if>\n  <sc-for list=\"{{ myReservations }}\" as=\"r\" hint-placeholder-count=\"2\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;border:2px solid #999;border-radius:6px;padding:16px 20px;flex-wrap:wrap;background:#fff\">\n      <div style=\"display:flex;flex-direction:column;gap:3px\">\n        <div style=\"font-size:16px;color:#444;font-weight:600\">{{ r.dateLabel }} · {{ r.time }} ({{ r.duration }})<\u002Fdiv>\n        <div style=\"font-size:14px;color:#888\">{{ r.people }} integrantes · {{ r.mesa }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;background:{{ r.stateBg }};color:{{ r.stateColor }}\">{{ r.stateLabel }}<\u002Fspan>\n        <sc-if value=\"{{ r.canManage }}\" hint-placeholder-val=\"{{ true }}\">\n          <a onclick=\"{{ r.modify }}\" style=\"font-size:14px;color:#CE1320;cursor:pointer\">Modificar<\u002Fa>\n          <a onclick=\"{{ r.cancel }}\" style=\"font-size:14px;color:#999;cursor:pointer\">Cancelar<\u002Fa>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ HACER PEDIDO ============ -->\n<sc-if value=\"{{ isPedido }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Hacer pedido\" style=\"padding:28px 32px;max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start\">\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-family:'Anton',sans-serif;font-size:30px;color:#444\">ARMÁ TU PEDIDO<\u002Fdiv>\n    <sc-for list=\"{{ pedidoDishes }}\" as=\"d\" hint-placeholder-count=\"6\">\n      <div style=\"display:flex;gap:12px;align-items:center;border:2px solid #999;border-radius:6px;padding:9px 12px;background:#fff\">\n        <div style=\"width:48px;height:48px;border:2px solid #bbb;border-radius:5px;background:repeating-linear-gradient(45deg,#f4f2ee,#f4f2ee 7px,#e9e6e0 7px,#e9e6e0 14px);flex:none;display:flex;align-items:center;justify-content:center;color:#8a857c;font-size:9px\">FOTO<\u002Fdiv>\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font-size:15px;color:#444;font-weight:600\">{{ d.name }}<\u002Fspan>\n          <span style=\"font-size:14px;color:#CE1320;font-weight:600\">{{ d.priceLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <button onclick=\"{{ d.dec }}\" style=\"width:30px;height:30px;border-radius:50%;border:2px solid #CE1320;background:#fff;color:#CE1320;font-size:17px;cursor:pointer;line-height:1\">−<\u002Fbutton>\n          <span style=\"min-width:18px;text-align:center;font-size:15px;font-weight:600\">{{ d.qty }}<\u002Fspan>\n          <button onclick=\"{{ d.inc }}\" style=\"width:30px;height:30px;border-radius:50%;border:2px solid #CE1320;background:#CE1320;color:#fff;font-size:17px;cursor:pointer;line-height:1\">+<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"border:2px solid #555;border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:14px;background:#faf7f2;position:sticky;top:80px\">\n    <div style=\"font-family:'Anton',sans-serif;font-size:20px;color:#444\">TU PEDIDO<\u002Fdiv>\n    <sc-if value=\"{{ cartEmpty }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:14px;color:#999\">Carrito vacío. Sumá platos.<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ cartHasItems }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:7px\">\n        <sc-for list=\"{{ cartLines }}\" as=\"l\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;justify-content:space-between;font-size:14px;color:#555\"><span>{{ l.qty }}× {{ l.name }}<\u002Fspan><span style=\"font-weight:600\">{{ l.subtotalLabel }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"border-top:2px solid #ddd;padding-top:7px;display:flex;justify-content:space-between;font-size:16px;font-weight:600;color:#CE1320\"><span>Total<\u002Fspan><span>{{ cartTotalLabel }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:flex;flex-direction:column;gap:7px\">\n      <div style=\"font-size:12px;color:#777\">MODALIDAD<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <a onclick=\"{{ setRetiro }}\" style=\"flex:1;text-align:center;font-size:13px;padding:9px;border-radius:5px;cursor:pointer;background:{{ retiroBg }};color:{{ retiroColor }};border:2px solid #CE1320;text-decoration:none\">Retiro<\u002Fa>\n        <a onclick=\"{{ setEnvio }}\" style=\"flex:1;text-align:center;font-size:13px;padding:9px;border-radius:5px;cursor:pointer;background:{{ envioBg }};color:{{ envioColor }};border:2px solid #CE1320;text-decoration:none\">Envío<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isEnvio }}\" hint-placeholder-val=\"{{ false }}\">\n      <label style=\"display:flex;flex-direction:column;gap:5px;font-size:12px;color:#777\">DIRECCIÓN\n        <input type=\"text\" value=\"{{ order.address }}\" oninput=\"{{ setAddress }}\" placeholder=\"Calle, altura, piso\" style=\"border:2px solid #999;border-radius:3px;padding:9px;font-size:14px\"><\u002Flabel>\n    <\u002Fsc-if>\n    <div style=\"display:flex;flex-direction:column;gap:7px\">\n      <div style=\"font-size:12px;color:#777\">PAGO<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <a onclick=\"{{ setEfectivo }}\" style=\"flex:1;text-align:center;font-size:13px;padding:9px;border-radius:5px;cursor:pointer;background:{{ efectivoBg }};color:{{ efectivoColor }};border:2px solid #CE1320;text-decoration:none\">Efectivo<\u002Fa>\n        <a onclick=\"{{ setTransferencia }}\" style=\"flex:1;text-align:center;font-size:13px;padding:9px;border-radius:5px;cursor:pointer;background:{{ transfBg }};color:{{ transfColor }};border:2px solid #CE1320;text-decoration:none\">Transferencia<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ pedidoError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background:#fbe4e4;border:1px solid #eab3b3;color:#b02020;font-size:13px;padding:9px 11px;border-radius:5px\">{{ pedidoError }}<\u002Fdiv><\u002Fsc-if>\n    <a onclick=\"{{ confirmPedido }}\" style=\"background:#CE1320;color:#fff;border:2px solid #CE1320;border-radius:3px;padding:12px;font-size:15px;cursor:pointer;text-align:center;text-decoration:none\">CONFIRMAR PEDIDO<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ MIS PEDIDOS ============ -->\n<sc-if value=\"{{ isMisPedidos }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Mis pedidos\" style=\"padding:28px 32px;max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:18px\">\n  <div style=\"font-family:'Anton',sans-serif;font-size:32px;color:#444\">MIS PEDIDOS<\u002Fdiv>\n  <sc-if value=\"{{ myOrdersEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:32px;text-align:center;background:#faf7f2;border:1px dashed #bbb;border-radius:6px;color:#999;font-size:15px\">Todavía no hiciste pedidos. <a onclick=\"{{ goPedido }}\" style=\"color:#CE1320;cursor:pointer\">Hacé tu primer pedido<\u002Fa>.<\u002Fdiv><\u002Fsc-if>\n  <sc-for list=\"{{ myOrders }}\" as=\"o\" hint-placeholder-count=\"2\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border:2px solid #999;border-radius:6px;padding:16px 20px;flex-wrap:wrap;background:#fff\">\n      <div style=\"display:flex;flex-direction:column;gap:4px\">\n        <div style=\"font-size:15px;color:#444;font-weight:600\">Pedido #{{ o.id }} · {{ o.modalityLabel }}<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#888\">{{ o.itemsText }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:#888\">{{ o.paymentLabel }} · {{ o.totalLabel }} {{ o.etaLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;background:{{ o.stateBg }};color:{{ o.stateColor }}\">{{ o.stateLabel }}<\u002Fspan>\n        <sc-if value=\"{{ o.canCancel }}\" hint-placeholder-val=\"{{ false }}\"><a onclick=\"{{ o.cancel }}\" style=\"font-size:14px;color:#999;cursor:pointer\">Cancelar<\u002Fa><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ ADMIN: MENÚ ============ -->\n<sc-if value=\"{{ isAdminMenu }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Admin Menú\" style=\"padding:26px 32px;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"background:#1a1a1a;color:#fff;font-size:12px;padding:3px 9px;border-radius:3px\">ADMIN<\u002Fspan><div style=\"font-family:'Anton',sans-serif;font-size:30px;color:#444\">GESTIÓN DE MENÚ<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:2px solid #555;border-radius:6px;padding:18px;background:#faf7f2;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"font-family:'Anton',sans-serif;font-size:16px;color:#444\">AGREGAR PLATO<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 0.8fr 1.4fr;gap:9px\">\n      <input type=\"text\" value=\"{{ newDish.name }}\" oninput=\"{{ setNdName }}\" placeholder=\"Nombre\" style=\"border:2px solid #999;border-radius:3px;padding:9px;font-size:14px\">\n      <select value=\"{{ newDish.sectionId }}\" onchange=\"{{ setNdSection }}\" style=\"border:2px solid #999;border-radius:3px;padding:9px;font-size:14px;background:#fff\"><sc-for list=\"{{ sectionOptions }}\" as=\"so\" hint-placeholder-count=\"4\"><option value=\"{{ so.id }}\">{{ so.title }}<\u002Foption><\u002Fsc-for><\u002Fselect>\n      <input type=\"number\" value=\"{{ newDish.price }}\" oninput=\"{{ setNdPrice }}\" placeholder=\"Precio\" style=\"border:2px solid #999;border-radius:3px;padding:9px;font-size:14px\">\n      <input type=\"text\" value=\"{{ newDish.img }}\" oninput=\"{{ setNdImg }}\" placeholder=\"URL imagen (opcional)\" style=\"border:2px solid #999;border-radius:3px;padding:9px;font-size:14px\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap\">\n      <a onclick=\"{{ toggleNdVegano }}\" style=\"font-size:13px;padding:7px 14px;border-radius:20px;cursor:pointer;background:{{ ndVeganoBg }};color:{{ ndVeganoColor }};border:2px solid #1f8a4d;text-decoration:none\">Vegano<\u002Fa>\n      <a onclick=\"{{ toggleNdTacc }}\" style=\"font-size:13px;padding:7px 14px;border-radius:20px;cursor:pointer;background:{{ ndTaccBg }};color:{{ ndTaccColor }};border:2px solid #b5730a;text-decoration:none\">Sin TACC<\u002Fa>\n      <a onclick=\"{{ addDish }}\" style=\"margin-left:auto;background:#CE1320;color:#fff;border:2px solid #CE1320;font-size:13px;padding:9px 20px;border-radius:3px;cursor:pointer;text-decoration:none\">+ AGREGAR PLATO<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:9px;align-items:center\">\n      <input type=\"text\" value=\"{{ newSection }}\" oninput=\"{{ setNewSection }}\" placeholder=\"Nueva sección\" style=\"flex:1;border:2px solid #999;border-radius:3px;padding:9px;font-size:14px\">\n      <a onclick=\"{{ addSection }}\" style=\"border:2px solid #CE1320;color:#CE1320;background:#fff;font-size:13px;padding:8px 18px;border-radius:3px;cursor:pointer;text-decoration:none\">+ SECCIÓN<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-for list=\"{{ adminSections }}\" as=\"s\" hint-placeholder-count=\"4\">\n    <div style=\"border:2px solid #999;border-radiu tyle=\"background:#1a1a1a;color:#fff;font-size:12px;padding:3px 9px;border-radius:3px\">ADMIN<\u002Fspan><div style=\"font-family:'Anton',sans-serif;font-size:30px;color:#444\">GESTIÓN DE RESERVAS<\u002Fdiv><\u002Fdiv>\n  <sc-for list=\"{{ allReservations }}\" as=\"r\" hint-placeholder-count=\"3\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:14px;border:2px solid #999;border-radius:6px;padding:14px 18px;flex-wrap:wrap;background:#fff\">\n      <div style=\"display:flex;flex-direction:column;gap:3px\">\n        <div style=\"font-size:15px;color:#444;font-weight:600\">{{ r.dateLabel }} · {{ r.time }} · {{ r.people }} pers.<\u002Fdiv>\n        <div style=\"font-size:13px;color:#888\">{{ r.userEmail }} · {{ r.mesa }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n        <span style=\"font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;background:{{ r.stateBg }};color:{{ r.stateColor }}\">{{ r.stateLabel }}<\u002Fspan>\n        <sc-if value=\"{{ r.needsAssign }}\" hint-placeholder-val=\"{{ false }}\">\n          <select value=\"{{ r.assignValue }}\" onchange=\"{{ r.assign }}\" style=\"border:2px solid #CE1320;border-radius:3px;padding:6px 9px;font-size:13px;background:#fff;color:#CE1320\"><option value=\"0\">Asignar mesa…<\u002Foption><option value=\"5\">Mesa 5<\u002Foption><option value=\"6\">Mesa 6<\u002Foption><\u002Fselect>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ r.canCancel }}\" hint-placeholder-val=\"{{ false }}\"><a onclick=\"{{ r.cancel }}\" style=\"font-size:14px;color:#999;cursor:pointer\">Cancelar<\u002Fa><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ ADMIN: PEDIDOS ============ -->\n<sc-if value=\"{{ isAdminPedidos }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Admin Pedidos\" style=\"padding:26px 32px;max-width:1040px;margin:0 auto;display:f t-size:12.5px;padding:7px 15px;border-radius:3px;cursor:pointer;text-decoration:none\">Avanzar → {{ o.nextLabel }}<\u002Fa><\u002Fsc-if>\n        <sc-if value=\"{{ o.canPay }}\" hint-placeholder-val=\"{{ false }}\"><a onclick=\"{{ o.markPaid }}\" style=\"border:2px solid #1f8a4d;color:#1f8a4d;background:#fff;font-size:12.5px;padding:7px 15px;border-radius:3px;cursor:pointer;text-decoration:none\">Marcar pagado<\u002Fa><\u002Fsc-if>\n        <a onclick=\"{{ o.del }}\" style=\"margin-left:auto;font-size:12.5px;color:#999;cursor:pointer\">Eliminar<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- FOOTER -->\n<footer style=\"border-top:2px solid #555;background:#fff;padding:26px 32px;margin-top:20px\">\n  <div style=\"max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font-family:'Anton',sans-serif;font-size:22px;color:#444\">PEPE DI ROMA<\u002Fdiv>\n      <div style=\"height:7px;width:90%;background:#ddd;border-radius:4px\"><\u002Fdiv>\n      <div style=\"height:7px;width:70%;background:#ddd;border-radius:4px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-size:13px;color:#777;letter-spacing:1px\">CONTACTO<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#888;display:flex;flex-direction:column;gap:4px\"><span>Villa Devoto, CABA<\u002Fspan><span>+54 11 5555-0000<\u002Fspan><span>Mar–Dom · 12–15 h / 20–24 h<\u002Fspan><span>hola@pepediroma.com.ar<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font-size:13px;color:#777;letter-spacing:1px\">SEGUINOS<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <div style=\"width:34px;height:34px;border-radius:50%;border:2px solid #999;display:flex;align-items:center;justify-content:center;font-size:12px;color:#777\">IG<\u002Fdiv>\n        <div style=\"width:34px;height:34px;border-radius:50%;border:2px solid #999;display:flex;align-items:center;justify-content:center;font-size:12px;color:#777\">FB<\u002Fdiv>\n        <div style=\"width:34px;height:34px;border-radius:50%;border:2px solid #999;display:flex;align-items:center;justify-content:center;font-size:12px;color:#777\">WA<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#888\">@pepediroma<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.uid = 100;\n    this.state = {\n      screen: 'inicio', role: 'visitante', userEmail: '', authNote: '',\n      idx: 0,\n      res: { date: '2026-07-10', time: '20:00', people: 2, tableId: null },\n      editingResId: null, resError: '',\n      cart: {}, order: { modality: 'retiro', payment: 'efectivo', address: '' }, pedidoError: '',\n      login: { email: '', pass: '' }, reg: { email: '', pass: '', dni: '' }, regError: '',\n      newSection: '', newDish: { sectionId: 1, name: '', price: '', img: '', vegano: false, sinTacc: false },\n      reservations: [\n        { id: 1, userEmail: 'cliente@pepediroma.com.ar', date: '2026-07-10', time: '20:00', people: 2, tableId: 1, status: 'vigente' },\n        { id: 2, userEmail: 'cliente@pepediroma.com.ar', date: '2026-07-12', time: '21:00', people: 6, tableId: null, status: 'vigente' },\n        { id: 3, userEmail: 'otro@mail.com', date: '2026-07-10', time: '20:00', people: 6, tableId: 5, status: 'vigente' }\n      ],\n      orders: [\n        { id: 1, userEmail: 'cliente@pepediroma.com.ar', items: [{ name: 'Gnocchi di patate', price: 8900, qty: 2 }, { name: 'Crocchette', price: 6400, qty: 1 }], modality: 'envio', address: 'Av. Nazca 2500', payment: 'transferencia', status: 'pendiente', total: 0, eta: null, paid: false }\n      ],\n      sections: [\n        { id: 1, title: 'Pastas Artesanales', dishes: [\n          { id: 11, name: 'Gnocchi di patate', price: 8900, vegano: true, sinTacc: false },\n          { id: 12, name: 'Sorrentinos della casa', price: 10500, vegano: false, sinTacc: false },\n          { id: 13, name: 'Polpette al pomodoro', price: 11200, vegano: false, sinTacc: false }\n        ]},\n        { id: 2, title: 'Crocchette', dishes: [\n          { id: 21, name: 'Crocchette', price: 6400, vegano: false, sinTacc: false },\n          { id: 22, name: 'Crocchette di verdure', price: 7000, vegano: true, sinTacc: false }\n        ]},\n        { id: 3, title: 'Schiacciate', dishes: [\n          { id: 31, name: 'Cotto e formaggio', price: 7800, vegano: false, sinTacc: false },\n          { id: 32, name: 'Mortadella e pesto', price: 8200, vegano: false, sinTacc: false }\n        ]},\n        { id: 4, title: 'Per Portare Via', dishes: [\n          { id: 41, name: 'Pasta fresca sin TACC x kg', price: 8500, vegano: false, sinTacc: true },\n          { id: 42, name: 'Ñoquis veganos x kg', price: 7500, vegano: true, sinTacc: true }\n        ]},\n        { id: 5, title: 'Dolci', dishes: [] }\n      ]\n    };\n    this.slides = [\n      { caption: 'La tradición en la mesa, desde siempre' },\n      { caption: 'Cocina a la vista, delantal puesto' },\n      { caption: 'El local: rústico, pero elegante' },\n      { caption: 'Promos y pedidos para llevar' }\n    ];\n    this.tableCaps = { 1: 4, 2: 4, 3: 4, 4: 4, 5: 6, 6: 6 };\n  }\n\n  componentDidMount() { this.startTimer(); }\n  componentWillUnmount() { clearInterval(this.timer); }\n  startTimer() { clearInterval(this.timer); this.timer = setInterval(() => this.go(this.state.idx + 1), 5000); }\n  go(i) { const n = this.slides.length; this.setState({ idx: ((i % n) + n) % n }); }\n\n  money(n) { return '$' + Number(n).toLocaleString('es-AR'); }\n  toMin(t) { if (!t) return -9999; const p = t.split(':'); return (+p[0]) * 60 + (+p[1]); }\n  fmtDate(d) { if (!d) return ''; const p = d.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }\n  slots() {\n    const out = [];\n    for (let m = 12 * 60; m <= 14 * 60 + 30; m += 30) out.push(this.mm(m));\n    for (let m = 20 * 60; m <= 23 * 60 + 30; m += 30) out.push(this.mm(m));\n    return out;\n  }\n  mm(m) { const h = Math.floor(m / 60), x = m % 60; return (h < 10 ? '0' + h : h) + ':' + (x < 10 ? '0' + x : x); }\n\n  scroll() { if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' }); }\n  nav(screen) { this.setState({ screen, authNote: '', resError: '', pedidoError: '', regError: '' }); this.scroll(); }\n  guard(screen) {\n    if (this.state.role === 'visitante') {\n      this.pending = screen;\n      this.setState({ screen: 'ingresar', authNote: 'Necesitás iniciar sesión para continuar.' });\n      this.scroll();\n    } else { this.nav(screen); }\n  }\n\n  doLogin() {\n    const email = (this.state.login.email || '').trim();\n    if (!email) { this.setState({ authNote: 'Ingresá tu email.' }); return; }\n    const role = email.toLowerCase().includes('admin') ? 'admin' : 'cliente';\n    const dest = this.pending || (role === 'admin' ? 'adminPedidos' : 'inicio');\n    this.pending = null;\n    this.setState({ role, userEmail: email, screen: dest, authNote: '', login: { email: '', pass: '' } });\n    this.scroll();\n  }\n  doRegister() {\n    const r = this.state.reg;\n    if (!r.email.trim() || !r.pass.trim() || !r.dni.trim()) { this.setState({ regError: 'Completá email, contraseña y DNI.' }); return; }\n    const dest = this.pending || 'inicio'; this.pending = null;\n    this.setState({ role: 'cliente', userEmail: r.email.trim(), screen: dest, regError: '', reg: { email: '', pass: '', dni: '' } });\n    this.scroll();\n  }\n  logout() { this.pending = null; this.setState({ role: 'visitante', userEmail: '', screen: 'inicio' }); this.scroll(); }\n\n  isOccupied(tid, date, time) {\n    return this.state.reservations.some(r => r.status === 'vigente' && r.tableId === t
